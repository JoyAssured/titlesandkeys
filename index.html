<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launching Soon - Titles & Keys</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --accent: #ff073a;
            --border: #30363d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px 30px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .logo-placeholder {
            width: 80px;
            height: 80px;
            background: rgba(255, 7, 58, 0.1);
            border: 1px solid rgba(255, 7, 58, 0.2);
            border-radius: 50%;
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .logo-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
        }

        .badge {
            display: inline-block;
            background: rgba(255, 7, 58, 0.1);
            color: var(--accent);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 6px 12px;
            border-radius: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 7, 58, 0.2);
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .contact-info {
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
            font-size: 0.9rem;
            text-align: left;
        }

        .contact-info div {
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        .contact-info div:last-child {
            margin-bottom: 0;
        }

        .contact-info a {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 500;
        }

        .contact-info a:hover {
            color: var(--accent);
        }

        .notify-form {
            display: flex;
            gap: 10px;
            flex-direction: column;
        }

        input[type="email"] {
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="email"]:focus {
            border-color: var(--accent);
        }

        button {
            background-color: var(--accent);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="logo-placeholder">
            <img src="logo.png" alt="Logo">
        </div>

        <span class="badge">Launching Soon</span>
        <h1>Something Exciting is on the Way</h1>
        <p>We are working hard behind the scenes to bring you an incredible experience. Stay tuned for our grand reveal.</p>
        
        <div class="contact-info">
            <div>📞 <strong>Call / WhatsApp:</strong> <a href="tel:+256779165080">+256 779 165080</a></div>
            <div>✉️ <strong>Email:</strong> <a href="mailto:titlesandkeys@gmail.com">titlesandkeys@gmail.com</a></div>
        </div>

        <form class="notify-form" onsubmit="event.preventDefault(); alert('Thank you! You have been added to our notification list.');">
            <input type="email" placeholder="Enter your email address" required>
            <button type="submit">Notify Me</button>
        </form>

        <div class="footer">
            &copy; 2026 Titles & Keys Company Limited. All rights reserved.
        </div>
    </div>

</body>
</html>
